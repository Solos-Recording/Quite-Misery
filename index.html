<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoloDoloSouls — Quite Misery</title>
  <meta name="description" content="Solodolosouls recordings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121212;
      --bg-elevated: #181818;
      --bg-highlight: #282828;
      --bg-press: #1a1a1a;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --green: #1db954;
      --green-hover: #1ed760;
      --border: #282828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== MAIN LAYOUT ===== */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== SIDEBAR (track list) ===== */
    .sidebar {
      width: 340px;
      min-width: 280px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header .kicker {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 600;
    }
    .sidebar-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }
    .sidebar-header .sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .track-list::-webkit-scrollbar { width: 8px; }
    .track-list::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: background 0.15s;
    }
    .track-row:hover { background: var(--bg-highlight); }
    .track-row.active { background: var(--bg-highlight); }
    .track-row.active .track-title { color: var(--green); }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #333;
    }
    .track-info { min-width: 0; flex: 1; }
    .track-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .track-num {
      font-size: 13px;
      color: var(--text-sub);
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ===== MAIN VIEW ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #3a2a2e 0%, var(--bg) 40%);
      overflow: hidden;
      position: relative;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 120px;
      text-align: center;
    }
    .hero-cover {
      width: min(320px, 70vw);
      height: min(320px, 70vw);
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      margin-bottom: 28px;
      background: #333;
    }
    .now-playing-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .now-title {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      max-width: 480px;
    }
    .now-artist {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* ===== BOTTOM PLAYER BAR ===== */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #181818;
      border-top: 1px solid #282828;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      z-index: 100;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .player-cover {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .player-meta { min-width: 0; }
    .player-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-artist {
      font-size: 12px;
      color: var(--text-sub);
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, transform 0.1s;
    }
    .ctrl-btn:hover { color: var(--text); }
    .ctrl-btn:active { transform: scale(0.92); }
    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--text);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { transform: scale(1.06); background: #fff; }
    .play-btn svg { width: 16px; height: 16px; }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 520px;
    }
    .time {
      font-size: 11px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }
    .time.end { text-align: right; }
    .progress {
      flex: 1;
      height: 4px;
      background: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress:hover { height: 6px; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text);
      border-radius: 2px;
      position: relative;
    }
    .progress:hover .progress-fill { background: var(--green); }
    .progress-fill::after {
      content: "";
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .progress:hover .progress-fill::after { opacity: 1; }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vol-icon { color: var(--text-sub); }
    input[type="range"] {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      background: #4d4d4d;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }
    input[type="range"]:hover::-webkit-slider-thumb { background: var(--green); }

    /* Empty / loading states */
    .empty-msg {
      color: var(--text-sub);
      font-size: 15px;
      padding: 40px 20px;
      text-align: center;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main-content { padding-bottom: 110px; }
      .hero-cover { width: 200px; height: 200px; }
      .player-bar {
        grid-template-columns: 1fr auto;
        height: 80px;
        padding: 0 12px;
      }
      .player-center { display: none; }
      .player-right { display: none; }
      .mobile-controls {
        display: flex !important;
        align-items: center;
        gap: 8px;
      }
    }
    .mobile-controls { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar track list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="kicker">Playlist</div>
        <h1>Quite Misery</h1>
        <div class="sub">SoloDoloSouls</div>
      </div>
      <div class="track-list" id="list">
        <div class="empty-msg">Loading tracks…</div>
      </div>
    </aside>

    <!-- Main view -->
    <main class="main">
      <div class="main-content">
        <img class="hero-cover" id="heroCover" src="https://raw.githubusercontent.com/Solos-Recording/Quite-Misery/main/art.png" alt="Cover" />
        <div class="now-playing-label" id="state">Ready</div>
        <div class="now-title" id="title">Choose a track</div>
        <div class="now-artist">SoloDoloSouls</div>
      </div>
    </main>
  </div>

  <!-- Bottom player bar -->
  <div class="player-bar">
    <div class="player-left">
      <img class="player-cover" id="playerCover" src="https://raw.githubusercontent.com/Solos-Recording/Quite-Misery/main/art.png" alt="" />
      <div class="player-meta">
        <div class="player-title" id="barTitle">—</div>
        <div class="player-artist">SoloDoloSouls</div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="ctrl-btn" id="prev" aria-label="Previous">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.7a.7.7 0 0 1 1.05.6v11.3a.7.7 0 0 1-1.05.6L4 8.15V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="play" aria-label="Play">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/></svg>
        </button>
        <button class="ctrl-btn" id="next" aria-label="Next">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.15A.7.7 0 0 0 1 1.75v11.3a.7.7 0 0 0 1.05.6L12 8.15V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time" id="cur">0:00</span>
        <div class="progress" id="bar" role="slider" aria-label="Seek">
          <div class="progress-fill" id="fill"></div>
        </div>
        <span class="time end" id="dur">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="vol-wrap">
        <svg class="vol-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.741 6.5a.75.75 0 0 1 .75.75v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 .75-.75zm-2.5 1a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5a.75.75 0 0 1 .75-.75zm5 0a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5a.75.75 0 0 1 .75-.75zM6.5 4.75a.75.75 0 0 0-1.5 0v6.5a.75.75 0 0 0 1.5 0v-6.5zM10 3.5a.75.75 0 0 1 .75.75v7.5a.75.75 0 0 1-1.5 0v-7.5A.75.75 0 0 1 10 3.5z"/></svg>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" />
      </div>
    </div>

    <!-- Mobile-only play controls -->
    <div class="mobile-controls">
      <button class="ctrl-btn play-btn" id="playMobile" aria-label="Play">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const ART = "https://raw.githubusercontent.com/Solos-Recording/Quite-Misery/main/art.png";
    let tracks = [];
    let index = 0;

    const audio = document.getElementById("audio");
    const titleEl = document.getElementById("title");
    const barTitle = document.getElementById("barTitle");
    const stateEl = document.getElementById("state");
    const playBtn = document.getElementById("play");
    const playMobile = document.getElementById("playMobile");
    const playIcon = document.getElementById("playIcon");
    const fill = document.getElementById("fill");
    const cur = document.getElementById("cur");
    const dur = document.getElementById("dur");
    const list = document.getElementById("list");
    const heroCover = document.getElementById("heroCover");
    const playerCover = document.getElementById("playerCover");

    const PLAY_SVG = '<path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/>';
    const PAUSE_SVG = '<path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/>';

    function fmt(s) {
      if (!Number.isFinite(s)) return "0:00";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return m + ":" + String(r).padStart(2, "0");
    }

    function titleFrom(name) {
      return name.replace(/\.mp3$/i, "");
    }

    function setPlayIcon(playing) {
      playIcon.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
      if (playMobile) {
        playMobile.querySelector("svg").innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
      }
    }

    function renderList() {
      list.innerHTML = "";
      if (!tracks.length) {
        list.innerHTML = '<div class="empty-msg">No tracks found</div>';
        return;
      }
      tracks.forEach((t, i) => {
        const row = document.createElement("button");
        row.className = "track-row" + (i === index ? " active" : "");
        row.type = "button";
        row.innerHTML = `
          <span class="track-num">${i + 1}</span>
          <img class="track-cover" src="${ART}" alt="" loading="lazy" />
          <div class="track-info">
            <div class="track-title"></div>
            <div class="track-artist">SoloDoloSouls</div>
          </div>
        `;
        row.querySelector(".track-title").textContent = t.title;
        row.addEventListener("click", () => load(i, true));
        list.appendChild(row);
      });
    }

    function load(i, autoplay) {
      if (!tracks.length) return;
      index = (i + tracks.length) % tracks.length;
      const t = tracks[index];
      titleEl.textContent = t.title;
      barTitle.textContent = t.title;
      audio.src = encodeURI(t.file);
      heroCover.src = ART;
      playerCover.src = ART;
      renderList();
      if (autoplay) audio.play().catch(() => {});
    }

    async function discover() {
      stateEl.textContent = "Loading…";
      titleEl.textContent = "Finding tracks";
      try {
        const res = await fetch("https://api.github.com/repos/Solos-Recording/Quite-Misery/contents/?ref=main", {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!res.ok) throw new Error("Could not list files");
        const items = await res.json();
        tracks = items
          .filter((f) => f.type === "file" && /\.mp3$/i.test(f.name))
          .map((f) => ({ title: titleFrom(f.name), file: f.name }))
          .sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: "base" }));

        if (!tracks.length) {
          titleEl.textContent = "No tracks yet";
          stateEl.textContent = "Empty";
          list.innerHTML = '<div class="empty-msg">No MP3s found in repo</div>';
          return;
        }
        stateEl.textContent = "Now Playing";
        load(0, false);
      } catch (e) {
        titleEl.textContent = "Could not load tracks";
        stateEl.textContent = "Error";
        list.innerHTML = '<div class="empty-msg">Failed to load from GitHub</div>';
      }
    }

    function togglePlay() {
      if (!tracks.length) return;
      if (!audio.src) load(0, true);
      else if (audio.paused) audio.play();
      else audio.pause();
    }

    playBtn.addEventListener("click", togglePlay);
    playMobile.addEventListener("click", togglePlay);
    document.getElementById("prev").addEventListener("click", () => load(index - 1, true));
    document.getElementById("next").addEventListener("click", () => load(index + 1, true));
    document.getElementById("vol").addEventListener("input", (e) => {
      audio.volume = Number(e.target.value);
    });

    document.getElementById("bar").addEventListener("click", (e) => {
      if (!audio.duration) return;
      const r = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });

    audio.addEventListener("play", () => {
      setPlayIcon(true);
      stateEl.textContent = "Now Playing";
    });
    audio.addEventListener("pause", () => {
      setPlayIcon(false);
      stateEl.textContent = "Paused";
    });
    audio.addEventListener("timeupdate", () => {
      cur.textContent = fmt(audio.currentTime);
      dur.textContent = fmt(audio.duration);
      fill.style.width = audio.duration ? (audio.currentTime / audio.duration * 100) + "%" : "0%";
    });
    audio.addEventListener("ended", () => load(index + 1, true));

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        togglePlay();
      }
    });

    audio.volume = 0.9;
    discover();
  </script>
</body>
</html>
